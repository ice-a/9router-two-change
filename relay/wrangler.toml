# Cloudflare Worker relay config — deploy with `npx wrangler deploy` (free plan works).
name = "nvidia-relay"
main = "cloudflare-worker.js"
compatibility_date = "2024-12-01"

[vars]
# Uncomment to lock the relay to NVIDIA NIM only (recommended for a public worker):
# ALLOWED_TARGETS = "https://integrate.api.nvidia.com"
